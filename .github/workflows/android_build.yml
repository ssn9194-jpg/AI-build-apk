name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Secrets (.env)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_KEY" ]; then
            echo "Injecting GEMINI_API_KEY from GitHub Secrets into .env..."
            echo "GEMINI_API_KEY=$GEMINI_KEY" > .env
          elif [ -f ".env.example" ]; then
            echo "Using .env.example fallback for GEMINI_API_KEY..."
            cp .env.example .env
          else
            echo "Creating empty .env..."
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: Ensure gradlew executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Find and Stage APK
        id: find_apk
        run: |
          mkdir -p output_apk
          APK_FILE=$(find app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" output_apk/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: output_apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
