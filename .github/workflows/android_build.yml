name: Android CI Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36.1
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME" \
                -type f \
                -name sdkmanager \
                2>/dev/null \
              | sort \
              | tail -n 1
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -e

          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f "debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f debug.keystore

      - name: Setup Environment
        shell: bash
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          if [ -n "$GEMINI_API_KEY_SECRET" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY_SECRET" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-build-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME" \
                -type f \
                -name sdkmanager \
                2>/dev/null \
              | sort \
              | tail -n 1
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          echo "=== Installed Android platforms ==="
          ls -la "$ANDROID_HOME/platforms"

          echo "=== Installed build tools ==="
          ls -la "$ANDROID_HOME/build-tools"

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -e

          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f debug.keystore

      - name: Setup Environment
        shell: bash
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          if [ -n "$GEMINI_API_KEY_SECRET" ]; then
            printf 'GEMINI_API_KEY=%s\n' \
              "$GEMINI_API_KEY_SECRET" > .env

            echo "Using GEMINI_API_KEY from GitHub Secrets."
          elif [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Using .env.example for build."
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            echo "Using placeholder API key."
          fi

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew

          echo "=== Java ==="
          java -version

          echo "=== Gradle wrapper ==="
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          echo "=== APK output ==="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::app-debug.apk was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-build-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          set -e

      - name: Setup Keystore
        run: |
          set -e
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Environment Variables
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY_SECRET" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY_SECRET" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: Ensure gradlew Executable
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK Files
        id: stage_apk
        run: |
          mkdir -p build_output
          find app/build/outputs/apk/debug/ -type f -name "*.apk" -exec cp {} build_output/app-debug.apk \;
          if [ ! -f "build_output/app-debug.apk" ]; then
            echo "::error::APK file not found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "APK successfully staged at build_output/app-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build_output/app-debug.apk
          retention-days: 14
          if-no-files-found: error
