name: Build & Release Android APK

on:
  push:
    branches: [ "**" ] # روی هر برنچی پوش شد اجرا شود
  workflow_dispatch:   # امکان اجرای دستی با یک دکمه در تب Actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # جهت دسترسی برای Release و آپلود آرتیفکت

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Key and Configuration
        run: |
          set -e
          # 1. بازیابی کلید امضای Debug از روی base64
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # 2. آماده‌سازی فایل کلیدهای محیطی .env
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

          # 3. ایجاد wrapper در صورت عدم وجود و دادن مجوز اجرا
          if [ ! -f "gradlew" ]; then
            echo "Generating gradlew wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          # بیلد APK با غیرفعال‌سازی configuration-cache برای سازگاری کامل در رانر لینوکس
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Locate and Rename APK
        id: find_apk
        run: |
          mkdir -p dist_apk
          APK_FILE=$(find app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist_apk/GeminiStudio-debug.apk
          echo "apk_path=dist_apk/GeminiStudio-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload APK as Artifact (Download from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: GeminiStudio-Android-APK
          path: dist_apk/GeminiStudio-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release with APK (Optional/Auto)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gemini Studio v1.0.${{ github.run_number }}
          body: |
            ### 📱 نسخه آماده نصب APK برنامه جمینای استودیو
            - بیلد خودکار توسط گیت‌هاب اکشنز (Run #${{ github.run_number }})
            - شامل آخرین تغییرات و قابلیت‌های پروژه
          files: dist_apk/GeminiStudio-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
